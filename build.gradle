// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.github.triplet.gradle:play-publisher:4.0.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
